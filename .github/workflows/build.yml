name: Build test package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build WPF application
        run: dotnet build .\app\SjtuGuardian.csproj -c Release --nologo
      - name: Make self-contained test package
        shell: pwsh
        run: .\Build-Release.ps1
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: SJTU-Network-Guardian-win-x64
          path: artifacts/SJTU-Network-Guardian-*.zip*
          if-no-files-found: error
